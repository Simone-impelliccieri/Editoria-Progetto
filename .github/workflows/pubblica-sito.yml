name: Pubblica il tesauro

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Scarica i file della repository
        uses: actions/checkout@v6

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Genera la pagina HTML
        run: |
          python -m pip install -r requirements.txt
          python scripts/genera_html.py

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Carica la cartella del sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Pubblica il sito
        uses: actions/deploy-pages@v5
